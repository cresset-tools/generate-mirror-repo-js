name: "Build & publish Mage-OS release to sconce"

# Builds one Mage-OS release and publishes its packages to a sconce
# repository, instead of building a satis repository and rsyncing it to a
# host. sconce keeps every earlier release, so only this one is built. A
# package version sconce already serves is compared, not republished:
# identical files are skipped, different files fail the run. A changed build
# needs a new version number.
#
# This does not push the release tag to the Mage-OS repositories; the
# satis workflow (build-mageos-release.yml) still does that.

on:
  workflow_dispatch:
    inputs:
      mageos_release:
        description: 'New Mage-OS version (e.g. 2.1.0)'
        required: true
        type: string
      upstream_release:
        description: 'Closest Magento Open Source version for the release (e.g. 2.4.8-p3)'
        required: true
        type: string
      release_refs_file:
        description: 'Optional refs file for a grace-window release, e.g. src/build-config/mage-os-release-refs/3.4.1.js'
        required: false
        default: ''
        type: string
      repo:
        description: 'Composer repository URL embedded in the packages'
        required: true
        default: 'https://mageos.bougierepo.com/'
        type: string
      sconce_url:
        description: 'sconce server to publish to'
        required: true
        default: 'https://bougierepo.com'
        type: string
      sconce_repo:
        description: 'sconce repository, as <org>/<repo>'
        required: true
        default: 'mage-os/releases'
        type: string

# One release per target repository at a time, and never cancel one halfway.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.sconce_repo }}
  cancel-in-progress: false

permissions:
  contents: read
  # sconce publish exchanges the job's OIDC token for a short-lived publish
  # token, so no secret is stored.
  id-token: write

env:
  SCONCE_VERSION: 0.10.1
  # Inputs reach the scripts through the environment, never spliced into them.
  MAGEOS_RELEASE: ${{ inputs.mageos_release }}
  UPSTREAM_RELEASE: ${{ inputs.upstream_release }}
  RELEASE_REFS_FILE: ${{ inputs.release_refs_file }}
  REPO_URL: ${{ inputs.repo }}
  SCONCE_URL: ${{ inputs.sconce_url }}
  SCONCE_REPO: ${{ inputs.sconce_repo }}

jobs:
  publish:
    runs-on: ubuntu-latest
    name: "Publish ${{ inputs.mageos_release }} to ${{ inputs.sconce_repo }}"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          tools: composer:2.7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci

      - name: "Put the committed PHP dependency analyzer on PATH"
        run: install -m 0755 bin/php-classes.phar /usr/local/bin/php-classes.phar

      - name: "Install sconce (pinned, checksummed)"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          asset=sconce-x86_64-unknown-linux-musl
          base="https://github.com/cresset-tools/sconce/releases/download/sconce-v${SCONCE_VERSION}"
          curl -fsSLO "$base/$asset.tar.gz"
          echo "$(curl -fsSL "$base/$asset.tar.gz.sha256" | cut -d' ' -f1)  $asset.tar.gz" | sha256sum -c -
          tar -xzf "$asset.tar.gz"
          install -m 0755 "$asset/sconce" /usr/local/bin/sconce
          sconce --version

      - name: "Build the release packages"
        run: |
          set -euo pipefail
          refs=()
          if [ -n "$RELEASE_REFS_FILE" ]; then
            refs=(--releaseRefsFile="$RELEASE_REFS_FILE")
          fi
          node src/make/mageos-release.js --skipHistory \
            --outputDir=build/packages --gitRepoDir=generate-repo/repositories \
            --repoUrl="$REPO_URL" \
            --mageosRelease="$MAGEOS_RELEASE" --upstreamRelease="$UPSTREAM_RELEASE" \
            "${refs[@]}"

      - name: "Publish to sconce"
        run: |
          node bin/publish-to-sconce.js --packagesDir=build/packages \
            --sconceUrl="$SCONCE_URL" --sconceRepo="$SCONCE_REPO"
